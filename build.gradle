plugins {
    id 'com.android.application' version '8.13.1' apply false
    id 'com.android.library' version '8.13.1' apply false
    id 'com.chaquo.python' version '17.0.0' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

project.ext {
    gsonVersion = '2.13.2'
    glideVersion = '5.0.5'
    media3Version = '1.8.0'
    okhttpVersion = '5.3.2'
}

// CI or restricted local environments can isolate generated outputs without touching existing build artifacts.
def buildOutputRoot = providers.gradleProperty('buildOutputRoot').orNull
if (buildOutputRoot) {
    allprojects { project ->
        def projectFolder = project.path == ':' ? 'root' : project.path.substring(1).replace(':', '/')
        project.layout.buildDirectory.set(new File(buildOutputRoot, projectFolder))
    }
}
