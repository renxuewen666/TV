name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: false
        type: string
        default: ''
      channel:
        description: '渠道'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: leanback
            abi: arm64_v8a
            variant: LeanbackArm64_v8aRelease
          - mode: leanback
            abi: armeabi_v7a
            variant: LeanbackArmeabi_v7aRelease
          - mode: mobile
            abi: arm64_v8a
            variant: MobileArm64_v8aRelease
          - mode: mobile
            abi: armeabi_v7a
            variant: MobileArmeabi_v7aRelease

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Update version
        if: ${{ inputs.version != '' }}
        run: |
          sed -i 's/versionName ".*"/versionName "${{ inputs.version }}"/' app/build.gradle

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build ${{ matrix.mode }}-${{ matrix.abi }}
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ matrix.variant }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mode }}-${{ matrix.abi }}
          path: app/build/outputs/apk/**/*.apk
