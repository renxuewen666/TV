name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: false
        type: string
        default: ''
      version_code:
        description: '版本码（正整数，留空使用 GitHub run number）'
        required: false
        type: string
        default: ''
      channel:
        description: '构建目标：all、10000（TV）或10001（手机）'
        required: false
        type: string
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: leanback
            abi: arm64_v8a
            app_id: '10000'
            variant: LeanbackArm64_v8aRelease
          - mode: leanback
            abi: armeabi_v7a
            app_id: '10000'
            variant: LeanbackArmeabi_v7aRelease
          - mode: mobile
            abi: arm64_v8a
            app_id: '10001'
            variant: MobileArm64_v8aRelease
          - mode: mobile
            abi: armeabi_v7a
            app_id: '10001'
            variant: MobileArmeabi_v7aRelease

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION_NAME="${{ inputs.version }}"
          VERSION_CODE="${{ inputs.version_code }}"
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="4.9.${{ github.run_number }}"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="${{ github.run_number }}"; fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build ${{ matrix.mode }}-${{ matrix.abi }}
        if: ${{ inputs.channel == 'all' || inputs.channel == matrix.app_id }}
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ matrix.variant }} -PversionName="${{ steps.version.outputs.name }}" -PversionCode="${{ steps.version.outputs.code }}"

      - name: Upload APK
        if: ${{ inputs.channel == 'all' || inputs.channel == matrix.app_id }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mode }}-${{ matrix.abi }}
          path: app/build/outputs/apk/${{ matrix.mode }}${{ matrix.abi == 'arm64_v8a' && 'Arm64_v8a' || 'Armeabi_v7a' }}/release/${{ matrix.mode }}-${{ matrix.abi }}.apk
